<script>
(function() {
  const q = new URLSearchParams(location.search);
  const installed = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const authReturn = /access_token|type=recovery|error_description/.test(location.hash) || q.has("code");
  let skip = false;
  try {
    skip = localStorage.getItem("wildy.skipLanding") === "1";
  } catch (e) {
  }
  const show = !installed && !authReturn && !q.has("perdido") && !q.has("codigo") && !q.has("app") && !skip;
  window.WILDY_LANDING = show;
  if (!show) return;
  const L = document.getElementById("landing");
  L.hidden = false;
  document.title = "Wildy \xB7 Tu manada, siempre a mano";
  const slogans = ["Tu manada, siempre a mano.", "Para los m\xE1s salvajes de casa.", "Cuidar de ellos nunca fue tan f\xE1cil.", "Vacunas, pesos y papeles. T\xFA solo disfruta.", "Peque\xF1os salvajes, grandes cuidados.", "Que no se te escape nada. Ni ellos."];
  const bg = document.getElementById("lg-bg");
  for (let i = 0; i < 9; i++) {
    const s = slogans[i % slogans.length] + "  \xB7  " + slogans[(i + 2) % slogans.length] + "  \xB7  ";
    const r = document.createElement("div");
    r.className = "lg-row";
    r.textContent = s + s + s + s;
    r.style.animationDuration = 120 + i * 14 + "s";
    bg.appendChild(r);
  }
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  const inApp = /Instagram|FBAN|FBAV|TikTok|musical_ly|Bytedance|Line\/|WhatsApp/i.test(ua);
  if (inApp) {
    const w = document.getElementById("lg-inapp");
    w.hidden = false;

      const email = val("a-email"), pass = val("a-pass");
      try {
        if (authMode === "forgot") {
          const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
          if (error) throw error;
          authMode = "login";
          authMsg = "Te hemos mandado un correo para cambiar la contrase\xF1a.";
        } else if (authMode === "register") {
          const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.origin + location.search, data: { name: val("a-name") } } });
          if (error) throw error;
          try {
            localStorage.setItem("wildy.pendingName", val("a-name"));
            localStorage.setItem("wildy.termsOk", "1");
          } catch (_) {
          }
          if (!data.session) {
            lastEmail = email;
            authMsg = "";
            authMode = "check";
            resendAt = Date.now() + 6e4;
          }
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password: pass });
          if (error && /Email not confirmed/i.test(error.message)) {
            lastEmail = email;
            authMsg = "Tu cuenta a\xFAn no est\xE1 activada. Conf\xEDrmala desde el correo.";
            authMode = "check";
            return render();
          }
          if (error) throw error;
        }
      } catch (err) {
        if (/rate limit|over_email/i.test(err.message || "") && authMode === "register") {
          lastEmail = email;
          authMode = "check";
          authMsg = "Ahora mismo no podemos mandar m\xE1s correos. Prueba a reenviarlo en un rato.";
          resendAt = Date.now() + 6e4;
          return render();
        }
        fail(err);
      }
      return render();
    }
    if (f === "passform") {
      const { error } = await sb.auth.updateUser({ password: val("np") });
      if (error) {
        fail(error);
        return render();
      }
      toast("Contrase\xF1a cambiada");
      view = { name: "home" };
      return render();
    }
    if (f === "joinform") {
      const c = val("j-code").toUpperCase();
      if (busy) return;
      busy = true;
      try {
        const { data, error } = await sb.rpc("accept_invite_multi", { c });
        if (error) throw error;
        await loadAll();
        view = { name: "home" };
        toast(data > 0 ? `\xA1Ya compartes ${data} mascota${data === 1 ? "" : "s"}!` : "Ya ten\xEDas esas mascotas");
      } catch (err) {
        fail(err);
      }
      busy = false;
      return render();
    }
    if (f === "oform") {
      const fields = { name: val("o-name"), phone: val("o-phone"), phone2: val("o-phone2"), city: val("o-city"), message: val("o-message") };
      return act(async () => {
        if (avatarDraft) fields.photo_url = await uploadPhoto(avatarDraft);
        const { error } = await sb.from("profiles").upsert(__spreadValues({ id: user.id }, fields));
        if (error) throw error;
        avatarDraft = null;
        view = { name: "home" };
      }, "Ajustes guardados");
    }
    if (f === "petform") {
      const name = val("f-name");
      if (!name) return render();
      const kg = num(val("f-kg"));
      const fields = { name, species: val("f-species"), sex: val("f-sex"), breed: val("f-breed"), birth: val("f-birth") || null, size: val("f-size"), temper: val("f-temper") };
      const editing = view.edit ? pets.find((x) => x.id === view.edit) : null;
      return act(async () => {
        if (photoDraft && photoDraft.startsWith("data:")) fields.photo_url = await uploadPhoto(photoDraft);
        let id;
        if (editing) {
          const { error } = await sb.from("pets").update(fields).eq("id", editing.id);
          if (error) throw error;
          id = editing.id;
        } else {
          const { data, error } = await sb.from("pets").insert(fields).select("id").single();
          if (error) throw error;
          id = data.id;
        }
        if (!isNaN(kg) && kg > 0 && (!editing || kg !== lastW(editing))) {
          const { error } = await sb.from("weights").upsert({ pet_id: id, date: iso(today()), kg }, { onConflict: "pet_id,date" });
          if (error) throw error;
        }
        photoDraft = "";
        view = { name: "pet", id, tab: "ficha" };
      }, editing ? "Cambios guardados" : "\xA1" + name + " ya est\xE1 en Wildy!");
    }
    if (f === "wform") {
      const kg = num(val("w-kg"));
      if (isNaN(kg) || kg <= 0) return render();
      return act(async () => {
        const { error } = await sb.from("weights").upsert({ pet_id: p.id, date: val("w-date"), kg }, { onConflict: "pet_id,date" });
        if (error) throw error;
      }, "Peso apuntado");
    }
    if (f === "eform") {
      const date = val("e-date");
      calMonth = new Date(parse(date).getFullYear(), parse(date).getMonth(), 1);
      return act(async () => {
        const { error } = await sb.from("events").insert({ pet_id: p.id, date, type: val("e-type"), title: val("e-title") });
        if (error) throw error;
      }, "Recordatorio a\xF1adido");
    }
    if (f === "iform") {
      const fields = { pet_id: p.id, company: val("i-company"), policy: val("i-policy"), phone: val("i-phone"), coverage: val("i-coverage") };
      return act(async () => {
        const { error } = await sb.from("insurance").upsert(fields);
        if (error) throw error;
        view.editIns = false;
      }, "Seguro guardado");
    }
    if (f === "bform") {
      const amount = num(val("b-amount"));
      if (isNaN(amount)) return render();
      return act(async () => {
        const { error } = await sb.from("bills").insert({ pet_id: p.id, date: val("b-date"), concept: val("b-concept"), amount });
        if (error) throw error;
      }, "Factura a\xF1adida");
    }
    render();
  });
  document.getElementById("filepick").addEventListener("change", async (e) => {
    if (photoTarget === "gallery") {
      const files = [...e.target.files].slice(0, 12);
      e.target.value = "";
      const p = cur();
      if (!files.length || !p) return;
      toast(files.length === 1 ? "Subiendo la foto\u2026" : `Subiendo ${files.length} fotos\u2026`);
      return act(async () => {
        const urls = [];
        for (const f of files) {
          urls.push(await uploadPhoto(await resizeFile(f)));
        }
        const { error } = await sb.from("pet_photos").insert(urls.map((url) => ({ pet_id: p.id, url })));
        if (error) throw error;
        if (!p.photo_url) {
          const r2 = await sb.from("pets").update({ photo_url: urls[0] }).eq("id", p.id);
          if (r2.error) throw r2.error;
        }
      }, files.length === 1 ? "Foto a\xF1adida" : `${files.length} fotos a\xF1adidas`);
    }
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const data = c.toDataURL("image/jpeg", 0.82);
        if (photoTarget === "avatar") {
          const keep = {};
          ["o-name", "o-phone", "o-phone2", "o-city", "o-message"].forEach((id) => {
            const el = document.getElementById(id);
            if (el) keep[id] = el.value;
          });
          avatarDraft = data;
          renderSettings();
          Object.entries(keep).forEach(([id, v]) => {
            const el = document.getElementById(id);
            if (el) el.value = v;
          });
          return;
        }
        photoDraft = data;
        const prev = document.getElementById("prev");
        if (prev) prev.innerHTML = `<img src="${photoDraft}" alt="">`;
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
  const params = new URLSearchParams(location.search);
  const lostId = params.get("perdido");
  if (lostId) {
    renderLost(lostId);
    return;
  }
  const joinCode = params.get("codigo");
  if (joinCode) {
    try {
      localStorage.setItem("wildy.pendingCode", joinCode.toUpperCase());
    } catch (_) {
    }
  }
  function pendingCode() {
    try {
      return localStorage.getItem("wildy.pendingCode");
    } catch (_) {
      return null;
    }
  }
  function invitedBanner() {
    return pendingCode() ? `<div class="warnbox" style="font-size:16px;padding:16px"><span>\u{1F43E} <b>Te han invitado a Wildy.</b> Entra o crea tu cuenta y ver\xE1s sus mascotas.</span></div>` : "";
  }
  let started = false;
  async function start(session, event) {
    if (event === "PASSWORD_RECOVERY") {
      user = session.user;
      view = { name: "newpass" };
      return render();
    }
    const was = user && user.id;
    user = session ? session.user : null;
    if (!user) {
      started = false;
      pets = [];
      owner = {};
      dmStop();
      if (channel) {
        sb.removeChannel(channel);
        channel = null;
      }
      view = { name: "home" };
      return render();
    }
    if (was === user.id && started) return;
    started = true;
    try {
      await loadAll();
      let pending = null;
      try {
        pending = localStorage.getItem("wildy.pendingName");
      } catch (_) {
      }
      const metaName = user.user_metadata && user.user_metadata.name;
      if (!owner.name && (pending || metaName)) {
        await sb.from("profiles").upsert({ id: user.id, name: pending || metaName });
        try {
          localStorage.removeItem("wildy.pendingName");
        } catch (_) {
        }
        await loadAll();
      }
    } catch (e) {
      fail(e);
    }
    listen();
    if (joinCode) history.replaceState(null, "", location.pathname + "?app=1");
    const code = pendingCode();
    if (code) {
      try {
        const { data, error } = await sb.rpc("accept_invite_multi", { c: code });
        if (error) throw error;
        await loadAll();
        toast(data > 0 ? `\xA1Ya compartes ${data} mascota${data === 1 ? "" : "s"}!` : "Ya ten\xEDas esas mascotas");
        view = { name: "home" };
      } catch (e) {
        fail(e);
      }
      try {
        localStorage.removeItem("wildy.pendingCode");
      } catch (_) {
      }
    }
    render();
  }
  sb.auth.onAuthStateChange((event, session) => {
    setTimeout(() => start(session, event), 0);
  });
  sb.auth.getSession().then(({ data }) => {
    if (!data.session) start(null, "INITIAL");
  });
})();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {
  });
}
</script>

(function() {
  if (!/pages\.dev$/.test(location.hostname)) return;
  var u = "https://app.wildyoyu.com/" + (location.search || "?app=1") + location.hash;
  var b = document.createElement("div");
  b.setAttribute("role", "status");
  b.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:70;background:#d42a3a;color:#fff;font:600 14px/1.35 system-ui,sans-serif;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;box-shadow:0 6px 18px -8px rgba(0,0,0,.4)";
  b.innerHTML = "<span>\u{1F43E} Wildy se ha mudado a <b>app.wildyoyu.com</b>. Funciona mejor y tambi\xE9n durante el f\xFAtbol.</span>";
  var a = document.createElement("a");
  a.href = u;
  a.textContent = "Ir a la nueva";
  a.style.cssText = "background:#fff;color:#d42a3a;border-radius:999px;padding:6px 14px;text-decoration:none;font-weight:800";
  b.appendChild(a);
  document.body ? document.body.appendChild(b) : document.addEventListener("DOMContentLoaded", function() {
    document.body.appendChild(b);
  });
})();
</script>
