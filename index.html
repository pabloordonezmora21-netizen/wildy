<script>
(function() {
  const q = new URLSearchParams(location.search);
  const installed = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const authReturn = /access_token|type=recovery|error_description/.test(location.hash) || q.has("code");
  let skip = false;
  try {
    skip = localStorage.getItem("wildy.skipLanding") === "1";
  } catch (e) {
  }
  const show = !installed && !authReturn && !q.has("perdido") && !q.has("codigo") && !q.has("app") && !skip;
  window.WILDY_LANDING = show;
  if (!show) return;
  const L = document.getElementById("landing");
  L.hidden = false;
  document.title = "Wildy \xB7 Tu manada, siempre a mano";
  const slogans = ["Tu manada, siempre a mano.", "Para los m\xE1s salvajes de casa.", "Cuidar de ellos nunca fue tan f\xE1cil.", "Vacunas, pesos y papeles. T\xFA solo disfruta.", "Peque\xF1os salvajes, grandes cuidados.", "Que no se te escape nada. Ni ellos."];
  const bg = document.getElementById("lg-bg");
  for (let i = 0; i < 9; i++) {
    const s = slogans[i % slogans.length] + "  \xB7  " + slogans[(i + 2) % slogans.length] + "  \xB7  ";
    const r = document.createElement("div");
    r.className = "lg-row";
    r.textContent = s + s + s + s;
    r.style.animationDuration = 120 + i * 14 + "s";
    bg.appendChild(r);
  }
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  const inApp = /Instagram|FBAN|FBAV|TikTok|musical_ly|Bytedance|Line\/|WhatsApp/i.test(ua);
  if (inApp) {
    const w = document.getElementById("lg-inapp");
    w.hidden = false;
    w.innerHTML = `<b>\xC1brela en ${isIOS ? "Safari" : "Chrome"} para instalarla.</b> Est\xE1s dentro de otra app. Toca <b>\xB7\xB7\xB7</b> arriba y elige <b>\u201CAbrir en el navegador\u201D</b>.`;
  }
  const paw = '<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><ellipse cx="16" cy="21" rx="7" ry="6"/><ellipse cx="7.5" cy="13" rx="3" ry="3.8"/><ellipse cx="24.5" cy="13" rx="3" ry="3.8"/><ellipse cx="12" cy="7" rx="3" ry="3.8"/><ellipse cx="20" cy="7" rx="3" ry="3.8"/></g></svg>';
  const share = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';
  const home = `<div class="ph-home">${'<div class="app"><span></span>App</div>'.repeat(6)}<div class="app w"><span>${paw}</span>Wildy</div></div>`;
  const page = `<div class="ph-page"><div class="m-paw">${paw}</div><b>Wildy</b><i>Tu manada, siempre a mano</i></div>`;
  const phones = {
    ios: `<div class="ph-dev ios vid"><div class="ph-scr"><video id="lg-vid" src="demo-ios.mp4" muted loop playsinline autoplay preload="auto" aria-label="V\xEDdeo: c\xF3mo a\xF1adir Wildy a la pantalla de inicio en iPhone"></video></div></div>`,
    and: `<div class="ph-dev and" role="img" aria-label="Animaci\xF3n: tocar los tres puntos de Chrome y luego Instalar app"><div class="ph-scr"><div class="ph-notch"></div>
      <div class="ph-web"><div class="ph-url">wildyapp.pages.dev<span class="ph-dots">\u22EE</span></div>${page}</div>
      <div class="ph-menu"><div class="ph-row">Nueva pesta\xF1a</div><div class="ph-row">Marcadores</div><div class="ph-row hl">Instalar app</div><div class="ph-row">Compartir\u2026</div></div>
      ${home}<div class="ph-tap t1"></div><div class="ph-tap t2"></div></div></div>`
  };
  const steps = {
    ios: ["Abre el enlace en <b>Safari</b> y toca los <b>tres puntos \xB7\xB7\xB7</b> abajo", `Toca <b>Compartir</b> <span class="lg-ic">${share}</span> y desliza hacia abajo`, "Elige <b>\u201CA\xF1adir a pantalla de inicio\u201D</b> y toca <b>A\xF1adir</b>"],
    and: ["Abre este enlace en <b>Chrome</b>", "Toca los <b>tres puntos \u22EE</b> arriba", "Elige <b>\u201CInstalar app\u201D</b> o <b>\u201CA\xF1adir a pantalla de inicio\u201D</b>"]
  };
  function setOS(os) {
    document.querySelectorAll(".lg-seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.os === os));
    const how = document.getElementById("lg-how");
    how.classList.remove("run");
    document.getElementById("lg-phone").innerHTML = phones[os];
    document.getElementById("lg-steps").innerHTML = steps[os].map((s) => `<li><span>${s}</span></li>`).join("");
    void how.offsetWidth;
    how.classList.add("run");
    const list = document.getElementById("lg-steps");
    list.classList.toggle("js", os === "ios");
    const v = document.getElementById("lg-vid");
    if (v) {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) {
        v.removeAttribute("autoplay");
        v.controls = true;
      } else {
        v.play().catch(() => {
          v.controls = true;
        });
      }
      const lis = [...list.children], cut = [1.9, 5.8];
      const sync = () => {
        const t = v.currentTime;
        const i = t < cut[0] ? 0 : t < cut[1] ? 1 : 2;
        lis.forEach((li, k) => li.classList.toggle("on", k === i));
      };
      v.addEventListener("timeupdate", sync);
      sync();
    }
  }
  document.querySelectorAll(".lg-seg button").forEach((b) => b.addEventListener("click", () => setOS(b.dataset.os)));
  setOS(isIOS ? "ios" : "and");
  if (isIOS && !inApp) {
    const qk = document.getElementById("lg-quick");
    qk.hidden = false;
    qk.innerHTML = `<span>\xB7\xB7\xB7 abajo</span>\u2192<span>Compartir</span>\u2192<span>A\xF1adir a inicio</span>`;
  }
  let deferred = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferred = e;
    document.getElementById("lg-install").hidden = false;
  });
  document.getElementById("lg-install").addEventListener("click", async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice.catch(() => {
    });
    deferred = null;
    document.getElementById("lg-install").hidden = true;
  });
  window.addEventListener("appinstalled", () => {
    document.getElementById("lg-install").hidden = true;
  });
  document.getElementById("lg-skip").addEventListener("click", () => {
    try {
      localStorage.setItem("wildy.skipLanding", "1");
    } catch (e) {
    }
    location.href = location.pathname + "?app=1";
  });
})();
</script>
